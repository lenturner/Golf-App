<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Golf Stats">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">
  <title>Standalone Golf Stats App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    .btn-toggle.active { background-color: #16a34a; color: white; border-color: #16a34a; font-weight: 600; }
    .clock-btn.active { background-color: #10b981; color: #0f172a; border-color: #34d399; font-weight: 800; transform: scale(1.08); }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-24 select-none">

  <!-- Top Header -->
  <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 sticky top-0 z-20 flex justify-between items-center">
    <div>
      <h1 class="text-base font-bold text-emerald-400">Golf Stats Pro</h1>
      <div class="flex gap-2 mt-1">
        <input id="courseName" type="text" onchange="persistActiveRound()" placeholder="Course" value="GGC" class="bg-slate-700 text-xs px-2 py-1 rounded border border-slate-600 w-28 text-white">
        <input id="roundDate" type="date" onchange="persistActiveRound()" class="bg-slate-700 text-xs px-2 py-1 rounded border border-slate-600 text-white">
      </div>
    </div>
    <div class="text-right">
      <div class="text-[11px] text-slate-400">Active Round</div>
      <div id="liveScore" class="text-2xl font-extrabold text-white">E</div>
    </div>
  </header>

  <!-- 6-Tab Navigation Bar -->
  <nav class="flex border-b border-slate-700 bg-slate-800 text-[11px] sm:text-xs font-semibold sticky top-[69px] z-20">
    <button onclick="switchTab('play')" id="tab-play" class="flex-1 py-3 text-center border-b-2 border-emerald-500 text-emerald-400">Play</button>
    <button onclick="switchTab('putt')" id="tab-putt" class="flex-1 py-3 text-center text-slate-400">Putt</button>
    <button onclick="switchTab('round')" id="tab-round" class="flex-1 py-3 text-center text-slate-400">Round</button>
    <button onclick="switchTab('career')" id="tab-career" class="flex-1 py-3 text-center text-slate-400">Career</button>
    <button onclick="switchTab('history')" id="tab-history" class="flex-1 py-3 text-center text-slate-400">History</button>
    <button onclick="switchTab('yardage')" id="tab-yardage" class="flex-1 py-3 text-center text-slate-400">Clubs</button>
  </nav>

  <!-- TAB 1: PLAY HOLE -->
  <main id="view-play" class="p-4 max-w-lg mx-auto space-y-4">
    <div class="flex items-center justify-between bg-slate-800 p-3 rounded-xl border border-slate-700">
      <button onclick="changeHole(-1)" class="px-5 py-2.5 bg-slate-700 rounded-lg font-bold active:bg-slate-600">&larr;</button>
      <div class="text-center">
        <span class="text-[11px] uppercase tracking-wider text-slate-400">Hole Tracker</span>
        <div class="text-2xl font-bold" id="holeTitle">Hole 1</div>
      </div>
      <button onclick="changeHole(1)" class="px-5 py-2.5 bg-emerald-600 rounded-lg font-bold active:bg-emerald-500">&rarr;</button>
    </div>

    <!-- Hole Par & Score -->
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-4">
      <div class="flex justify-between items-center">
        <span class="text-sm font-semibold text-slate-300">Hole Par</span>
        <div class="flex gap-2" id="parButtons">
          <button onclick="setPar(3)" data-val="3" class="btn-toggle px-4 py-2 rounded-lg border border-slate-600 bg-slate-700 text-sm">Par 3</button>
          <button onclick="setPar(4)" data-val="4" class="btn-toggle active px-4 py-2 rounded-lg border border-slate-600 bg-slate-700 text-sm">Par 4</button>
          <button onclick="setPar(5)" data-val="5" class="btn-toggle px-4 py-2 rounded-lg border border-slate-600 bg-slate-700 text-sm">Par 5</button>
        </div>
      </div>

      <div>
        <span class="text-sm font-semibold text-slate-300 block mb-2">Score Relative to Par</span>
        <div class="grid grid-cols-6 gap-1.5" id="scoreButtons">
          <button onclick="setRelScore(-2)" data-val="-2" class="btn-toggle py-2.5 rounded-lg border border-slate-600 bg-slate-700 text-xs">Eagle<br>-2</button>
          <button onclick="setRelScore(-1)" data-val="-1" class="btn-toggle py-2.5 rounded-lg border border-slate-600 bg-slate-700 text-xs">Birdie<br>-1</button>
          <button onclick="setRelScore(0)" data-val="0" class="btn-toggle active py-2.5 rounded-lg border border-slate-600 bg-slate-700 text-xs">Par<br>0</button>
          <button onclick="setRelScore(1)" data-val="1" class="btn-toggle py-2.5 rounded-lg border border-slate-600 bg-slate-700 text-xs">Bogey<br>+1</button>
          <button onclick="setRelScore(2)" data-val="2" class="btn-toggle py-2.5 rounded-lg border border-slate-600 bg-slate-700 text-xs">Dbl<br>+2</button>
          <button onclick="setRelScore(3)" data-val="3" class="btn-toggle py-2.5 rounded-lg border border-slate-600 bg-slate-700 text-xs">Trp+<br>+3</button>
        </div>
      </div>
    </div>

    <!-- Fairway & Approach -->
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-4">
      <div id="fairwaySection">
        <span class="text-sm font-semibold text-slate-300 block mb-2">Fairway Hit (Par 4/5)</span>
        <div class="grid grid-cols-4 gap-2" id="fwyButtons">
          <button onclick="setFwy('Yes')" data-val="Yes" class="btn-toggle py-2 rounded-lg border border-slate-600 bg-slate-700 text-sm">Yes</button>
          <button onclick="setFwy('Left')" data-val="Left" class="btn-toggle py-2 rounded-lg border border-slate-600 bg-slate-700 text-sm">Left</button>
          <button onclick="setFwy('Right')" data-val="Right" class="btn-toggle py-2 rounded-lg border border-slate-600 bg-slate-700 text-sm">Right</button>
          <button onclick="setFwy('Short')" data-val="Short" class="btn-toggle py-2 rounded-lg border border-slate-600 bg-slate-700 text-sm">Short</button>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4 pt-1">
        <div>
          <label class="text-sm font-semibold text-slate-300 block mb-1">Approach Dist (m)</label>
          <input id="appDist" type="number" inputmode="decimal" oninput="saveCurrentHole()" placeholder="e.g. 135" class="w-full bg-slate-700 p-2.5 rounded-lg border border-slate-600 text-white">
        </div>
        <div>
          <span class="text-sm font-semibold text-slate-300 block mb-1">Green in Reg (GIR)</span>
          <div class="grid grid-cols-2 gap-2" id="girButtons">
            <button onclick="setGir('Yes')" data-val="Yes" class="btn-toggle py-2.5 rounded-lg border border-slate-600 bg-slate-700 text-sm">Yes</button>
            <button onclick="setGir('No')" data-val="No" class="btn-toggle active py-2.5 rounded-lg border border-slate-600 bg-slate-700 text-sm">No</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Short Game & Penalties -->
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 grid grid-cols-3 gap-3">
      <div>
        <label class="text-xs font-semibold text-slate-400 block mb-1">Chips</label>
        <input id="chips" type="number" inputmode="numeric" min="0" value="0" oninput="saveCurrentHole()" class="w-full bg-slate-700 p-2 rounded-lg border border-slate-600 text-center">
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-400 block mb-1">Sand Shots</label>
        <input id="sandShots" type="number" inputmode="numeric" min="0" value="0" oninput="saveCurrentHole()" class="w-full bg-slate-700 p-2 rounded-lg border border-slate-600 text-center">
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-400 block mb-1">Penalties</label>
        <input id="penShots" type="number" inputmode="numeric" min="0" value="0" oninput="saveCurrentHole()" class="w-full bg-slate-700 p-2 rounded-lg border border-slate-600 text-center">
      </div>
    </div>

    <!-- Putting -->
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
      <div class="flex justify-between items-center">
        <span class="text-sm font-semibold text-slate-300">Putt Distances (m)</span>
        <span id="autoPuttSummary" class="text-xs bg-emerald-900/60 text-emerald-300 px-2.5 py-1 rounded-full">0 Putts</span>
      </div>
      <div class="grid grid-cols-4 gap-2">
        <div><label class="text-xs text-slate-400">1st Putt</label><input id="putt1" type="number" inputmode="decimal" step="0.1" placeholder="m" oninput="saveCurrentHole()" class="w-full bg-slate-700 p-2 rounded-lg border border-slate-600 text-center"></div>
        <div><label class="text-xs text-slate-400">2nd Putt</label><input id="putt2" type="number" inputmode="decimal" step="0.1" placeholder="m" oninput="saveCurrentHole()" class="w-full bg-slate-700 p-2 rounded-lg border border-slate-600 text-center"></div>
        <div><label class="text-xs text-slate-400">3rd Putt</label><input id="putt3" type="number" inputmode="decimal" step="0.1" placeholder="m" oninput="saveCurrentHole()" class="w-full bg-slate-700 p-2 rounded-lg border border-slate-600 text-center"></div>
        <div><label class="text-xs text-slate-400">4th Putt</label><input id="putt4" type="number" inputmode="decimal" step="0.1" placeholder="m" oninput="saveCurrentHole()" class="w-full bg-slate-700 p-2 rounded-lg border border-slate-600 text-center"></div>
      </div>
    </div>
  </main>

  <!-- TAB 2: PUTT BREAK CALCULATOR (FROM PUTTING MATRIX) -->
  <section id="view-putt" class="hidden p-4 max-w-lg mx-auto space-y-4">
    <!-- Result Banner -->
    <div class="bg-gradient-to-br from-emerald-900/80 to-slate-800 p-5 rounded-2xl border border-emerald-500/40 text-center shadow-lg">
      <div class="text-xs uppercase tracking-widest text
